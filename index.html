<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Translator — Live Chinese ⇄ English</title>
<style>
  :root {
    --ink: #141414;
    --ink2: #3d3d3d;
    --muted: #8a8a8a;
    --line: #ececec;
    --green: #1db954;
    --red: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; height: 100dvh; }

  header {
    flex: 0 0 auto;
    padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
    border-bottom: 1px solid var(--line);
    text-align: center;
    background: #fff;
    z-index: 3;
  }
  .langs { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .langs .swap { color: var(--muted); font-weight: 400; margin: 0 6px; }
  .status {
    margin-top: 3px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 16px;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #cfcfcf; flex: 0 0 auto;
  }
  .status.live .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .status.busy .dot { background: #f5a623; animation: pulse .8s ease-in-out infinite; }
  .status.error { color: var(--red); }
  .status.error .dot { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  #keybar {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
    padding: 10px 14px;
    background: #fafafa;
    z-index: 3;
  }
  #keybar .row { display: flex; gap: 8px; align-items: center; }
  #keybar input {
    flex: 1 1 auto; min-width: 0;
    font-size: 14px; padding: 9px 10px;
    border: 1px solid #d9d9d9; border-radius: 9px;
    background: #fff; color: var(--ink);
  }
  #keybar button {
    flex: 0 0 auto;
    font-size: 14px; padding: 9px 14px;
    border: 0; border-radius: 9px;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  #keybar .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
  #keybar .savedline {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--muted);
  }
  #keybar .savedline button {
    background: none; color: var(--ink); border: 0; font-size: 13px;
    text-decoration: underline; padding: 2px 0; cursor: pointer;
  }
  #keybar.hidden { display: none; }
  #keybar.attention input { border-color: var(--red); }

  #stream {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 20px 12px;
    scroll-behavior: auto;
  }
  .pair { margin: 0 0 20px; }
  .pair .src {
    font-size: 21px; line-height: 1.38; color: var(--ink);
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .pair .dst {
    font-size: 20px; line-height: 1.38; color: var(--ink2);
    margin-top: 3px;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .pair.live .src, .pair.live .dst { color: #555; }
  .pair.live .dst:empty { display: none; }
  .empty-hint {
    color: var(--muted); font-size: 15px; line-height: 1.6;
    text-align: center; margin-top: 12vh; padding: 0 24px;
  }

  #pill {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(108px + env(safe-area-inset-bottom));
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.14);
    display: none; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5; padding: 0;
  }
  #pill.show { display: flex; }
  #pill svg { width: 18px; height: 18px; stroke: #555; }

  footer {
    flex: 0 0 auto;
    padding: 12px 0 calc(16px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
    background: #fff; z-index: 3;
  }
  #callBtn {
    width: 66px; height: 66px; border-radius: 50%;
    border: 0; cursor: pointer;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    transition: background .15s ease;
  }
  #callBtn svg { width: 30px; height: 30px; fill: #fff; }
  #callBtn.on { background: var(--red); }
  #callBtn.on svg { transform: rotate(135deg); }
  #callBtn:active { transform: scale(.96); }
</style>
</head>
<body>

<header>
  <div class="langs">英语 <span class="swap">⇄</span> 中文</div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Tap the button to start</span></div>
</header>

<div id="keybar">
  <div class="row" id="keyEditRow">
    <input id="keyInput" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Gemini API key">
    <button id="keySave" type="button">Save</button>
  </div>
  <div class="note" id="keyNote">Your key stays on this device (localStorage) and is sent only to Google. Get one free in Google AI Studio.</div>
  <div class="savedline" id="keySavedRow" style="display:none">
    <span>Gemini key saved on this device</span>
    <button id="keyChange" type="button">Change</button>
  </div>
</div>

<main id="stream">
  <div class="empty-hint" id="emptyHint">One flowing conversation.<br>Talk in English or Chinese — the translation speaks itself.</div>
</main>

<button id="pill" type="button" aria-label="Jump to latest">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10l7 7 7-7"/></svg>
</button>

<footer>
  <button id="callBtn" type="button" aria-label="Start or stop">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.4 11.4 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
  </button>
</footer>

<script>
"use strict";

/* =====================================================================
   Translator — live Chinese <-> English conversation voice translation.
   One static page, no backend, no dependencies.

   Two Gemini Live Translate sessions (one per target language) hear the
   same microphone stream. Per-utterance language attribution is by
   transcript script vote (ported from the native app): a session may
   only sound when its INPUT transcript decisively votes for that
   session's source language. All approved audio plays through ONE
   serialized playback queue — a sentence that starts, finishes.
   ===================================================================== */

/* ---------------- Protocol (verbatim from the proven rigs) ---------------- */

var WS_BASE = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";

/* The app's exact setups — a factory keeps the two byte-identical apart
   from targetLanguageCode. (gemini-live-protocol-test-harness,
   gemini-latency-test.html: pairSetup) */
function pairSetup(targetLanguageCode, resumptionHandle) {
  var setup = {
    "setup": {
      "model": "models/gemini-3.5-live-translate-preview",
      "inputAudioTranscription": {},
      "outputAudioTranscription": {},
      "generationConfig": {
        "responseModalities": ["AUDIO"],
        "translationConfig": {
          "targetLanguageCode": targetLanguageCode,
          "echoTargetLanguage": false
        }
      },
      "sessionResumption": {}
    }
  };
  if (resumptionHandle) setup.setup.sessionResumption = { "handle": resumptionHandle };
  return setup;
}

/* Server messages may arrive as binary frames; decode every frame as
   UTF-8 text and JSON-parse. (Rig code, unchanged.) */
function utf8Decode(buffer) {
  if (typeof TextDecoder !== "undefined") {
    return new TextDecoder("utf-8").decode(new Uint8Array(buffer));
  }
  var bytes = new Uint8Array(buffer);
  var s = "";
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
}
function decodeFrameData(data, cb) {
  if (typeof data === "string") { cb(data); return; }
  if (data instanceof ArrayBuffer) { cb(utf8Decode(data)); return; }
  if (typeof Blob !== "undefined" && data instanceof Blob) {
    if (typeof data.arrayBuffer === "function") {
      data.arrayBuffer().then(function (buf) { cb(utf8Decode(buf)); }, function () { cb(null); });
    } else {
      var reader = new FileReader();
      reader.onload = function () { cb(utf8Decode(reader.result)); };
      reader.onerror = function () { cb(null); };
      reader.readAsArrayBuffer(data);
    }
    return;
  }
  cb(null);
}

/* ---------------- Small helpers ---------------- */

function $(id) { return document.getElementById(id); }
function now() { return Date.now(); }

function bytesToB64(bytes) {
  var s = "", i, chunk = 0x8000;
  for (i = 0; i < bytes.length; i += chunk) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(s);
}
function b64ToBytes(b64) {
  var bin = atob(b64), out = new Uint8Array(bin.length), i;
  for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function approxB64Bytes(b64) {
  if (!b64) return 0;
  var len = b64.length, padding = 0;
  if (len >= 1 && b64.charAt(len - 1) === "=") padding++;
  if (len >= 2 && b64.charAt(len - 2) === "=") padding++;
  return Math.floor(len * 3 / 4) - padding;
}

/* ---------------- Script vote (gate) ----------------
   Ported from the app's DirectionPlaybackGate voting: Han characters
   vote Chinese, Latin letters vote English; kana, Hangul and
   Vietnamese-marked Latin vote for NEITHER (foreign). A vote is
   decisive when one side clearly leads. */

function scriptCounts(text) {
  var han = 0, latin = 0, foreign = 0;
  for (var i = 0; i < text.length; i++) {
    var cp = text.codePointAt(i);
    if (cp > 0xffff) { i++; continue; }
    if ((cp >= 0x4e00 && cp <= 0x9fff) || (cp >= 0x3400 && cp <= 0x4dbf) ||
        (cp >= 0xf900 && cp <= 0xfaff)) {
      han++;
    } else if ((cp >= 0x3040 && cp <= 0x30ff) ||          // kana
               (cp >= 0xac00 && cp <= 0xd7af) ||          // Hangul syllables
               (cp >= 0x1100 && cp <= 0x11ff) ||          // Hangul jamo
               (cp >= 0x1e00 && cp <= 0x1eff) ||          // Vietnamese tone letters
               cp === 0x0103 || cp === 0x00e2 || cp === 0x0111 || // ă â đ
               cp === 0x00ea || cp === 0x00f4 || cp === 0x01a1 || // ê ô ơ
               cp === 0x01b0 || cp === 0x0102 || cp === 0x00c2 || // ư Ă Â
               cp === 0x0110 || cp === 0x00ca || cp === 0x00d4 || // Đ Ê Ô
               cp === 0x01a0 || cp === 0x01af ||                // Ơ Ư
               (cp >= 0x0300 && cp <= 0x036f)) {                // combining marks (Vietnamese tones)
      foreign++;
    } else if ((cp >= 0x41 && cp <= 0x5a) || (cp >= 0x61 && cp <= 0x7a) ||
               (cp >= 0xc0 && cp <= 0x24f)) {
      latin++;
    }
  }
  return { han: han, latin: latin, foreign: foreign };
}

/* Returns "zh", "en", "foreign", or null (not yet decisive). */
function scriptVote(text) {
  var c = scriptCounts(text);
  if (c.foreign >= 2) return "foreign";
  if (c.foreign === 1 && c.han < 3 && c.latin < 3) return "foreign";
  if (c.han >= 2 && c.han > c.latin) return "zh";
  if (c.latin >= 3 && c.latin > c.han) return "en";
  return null;
}

/* ---------------- Sentence cutting ----------------
   Rig rule: a sentence is complete at 。！？ or ! or ? always; "." only
   when NOT flanked by digits on both sides (3.5 is not a sentence end).
   Returns the index of the first sentence-final character, or -1. */

var SENTENCE_FINAL_CHARS = "。！？!?…";
function firstSentenceEnd(text) {
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (SENTENCE_FINAL_CHARS.indexOf(ch) !== -1) return i;
    if (ch === ".") {
      var prev = i > 0 ? text.charAt(i - 1) : "";
      var next = i + 1 < text.length ? text.charAt(i + 1) : "";
      var prevDigit = prev >= "0" && prev <= "9";
      var nextDigit = next >= "0" && next <= "9";
      if (!(prevDigit && nextDigit)) return i;
    }
  }
  return -1;
}
function clauseBoundary(text) {
  var marks = "，,、；;：: ";
  for (var i = text.length - 1; i > 0; i--) {
    if (marks.indexOf(text.charAt(i)) !== -1) return i;
  }
  return -1;
}

/* ---------------- Echo guard ----------------
   The phone's own played translations are fresh input to the mic.
   Ported from the app: an utterance whose input transcript matches a
   recently played translation is the phone hearing itself — it never
   passes the gate and its pairs are never shown. */

var playedLog = []; // { norm, at } — newest last, capped
function normalizeForEcho(text) {
  return String(text || "").toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, "");
}
function notePlayed(text) {
  var n = normalizeForEcho(text);
  if (n.length >= 2) {
    playedLog.push({ norm: n, at: now() });
    while (playedLog.length > 6) playedLog.shift();
  }
}
function looksLikeEcho(text) {
  var n = normalizeForEcho(text);
  if (n.length < 4) return false;
  var t = now();
  for (var i = playedLog.length - 1; i >= 0; i--) {
    var p = playedLog[i];
    if (t - p.at > 8000) continue;
    if (n.indexOf(p.norm) !== -1 || p.norm.indexOf(n) !== -1) return true;
  }
  return false;
}

/* ---------------- The one-voice playback queue ----------------
   Every approved utterance becomes a job. Jobs play strictly in the
   order their gate passed; chunks inside a job schedule gaplessly.
   A started sentence is never stopped, ducked or overlapped — the
   next job waits for the current one's last sample. */

var playCtx = null;
var playQueue = [];      // jobs waiting
var playingJob = null;   // job currently sounding (or waiting for chunks)

function ensurePlayCtx() {
  if (playCtx) return playCtx;
  var AC = window.AudioContext || window.webkitAudioContext;
  try { playCtx = new AC({ sampleRate: 24000 }); }
  catch (e) { playCtx = new AC(); }
  return playCtx;
}

function pcmChunkToBuffer(bytes) {
  var frames = Math.floor(bytes.length / 2);
  var buf = playCtx.createBuffer(1, Math.max(frames, 1), 24000);
  var data = buf.getChannelData(0);
  var view = new DataView(bytes.buffer, bytes.byteOffset, frames * 2);
  for (var i = 0; i < frames; i++) data[i] = view.getInt16(i * 2, true) / 32768;
  return buf;
}

function makeJob(session) {
  return {
    session: session,
    chunks: [],        // Uint8Array PCM16 @ 24 kHz, arrival order
    nextChunk: 0,
    pendingSources: 0,
    cursor: 0,         // ctx time the next chunk starts
    textDone: false,   // utterance text flushed; no more chunks expected soon
    closed: false,     // sealed: player may advance past this job
    lastChunkAt: now(),
    dead: false        // dropped before ever sounding (stop / echo)
  };
}

function pumpPlayer() {
  if (!playCtx || playingJob) return;
  while (playQueue.length) {
    var job = playQueue.shift();
    if (job.dead) continue;
    playingJob = job;
    job.cursor = Math.max(playCtx.currentTime + 0.03, job.cursor || 0);
    scheduleJobChunks(job);
    if (playingJob === job) return; // scheduling in progress / waiting on chunks
  }
}

function scheduleJobChunks(job) {
  if (!playCtx || job.dead) return;
  while (job.nextChunk < job.chunks.length) {
    var bytes = job.chunks[job.nextChunk++];
    if (!bytes || bytes.length < 2) continue;
    var buf = pcmChunkToBuffer(bytes);
    var src = playCtx.createBufferSource();
    src.buffer = buf;
    src.connect(playCtx.destination);
    var startAt = Math.max(job.cursor, playCtx.currentTime + 0.01);
    try { src.start(startAt); } catch (e) { continue; }
    job.cursor = startAt + buf.duration;
    job.pendingSources++;
    (function (j) {
      src.onended = function () {
        j.pendingSources--;
        onJobProgress(j);
      };
    })(job);
  }
  onJobProgress(job);
}

function onJobProgress(job) {
  if (playingJob !== job) return;
  if (job.nextChunk < job.chunks.length) { scheduleJobChunks(job); return; }
  if (job.pendingSources > 0) return;
  if (job.closed || job.dead) {
    playingJob = null;
    pumpPlayer();
  }
  // Otherwise the job is still open and starved: it resumes when the
  // next chunk lands (addChunkToJob calls scheduleJobChunks).
}

function addChunkToJob(job, bytes) {
  if (job.dead) return;
  job.chunks.push(bytes);
  job.lastChunkAt = now();
  if (playingJob === job) scheduleJobChunks(job);
}

function sealJob(job) {
  if (!job || job.closed) return;
  job.closed = true;
  onJobProgress(job);
}

/* ---------------- Sessions ----------------
   One session per target language. Session "en" translates Chinese
   speech into English (source zh); session "zh" translates English
   speech into Chinese (source en). Both hear everything. */

var BACKOFF_MS = [1000, 2000, 5000, 10000];
var running = false;
var fatalError = null;

function makeSession(target, source) {
  return {
    target: target,          // "en" | "zh-Hans"
    source: source,          // "zh" | "en"
    ws: null,
    ready: false,
    resumptionHandle: null,
    backoffIdx: 0,
    reconnectTimer: null,
    intentionalClose: false,
    // current utterance (text side)
    inAcc: "",
    outAcc: "",
    segStartAt: 0,           // when the current uncut sentence segment began
    uttStartAt: 0,           // when the current utterance began
    lastInAt: 0,
    lastOutAt: 0,
    lastTextAt: 0,
    // current utterance (audio side)
    preGateChunks: [],       // buffered until the gate decides
    gatePassed: false,
    echo: false,
    wrongDirection: false,
    job: null,               // open playback job for this utterance, if passed
    tailJob: null,           // last utterance's job, still receiving its tail
    openJobs: []             // all unsealed jobs of this session
  };
}

var sessEn = makeSession("en", "zh");        // Chinese in -> English out
var sessZh = makeSession("zh-Hans", "en");   // English in -> Chinese out
var sessions = [sessEn, sessZh];

function apiKey() {
  try { return (localStorage.getItem("translatorGeminiKey") || "").trim(); }
  catch (e) { return ""; }
}

function connectSession(s, useHandle) {
  if (!running) return;
  var key = apiKey();
  if (!key) return;
  var ws;
  try {
    ws = new WebSocket(WS_BASE + "?key=" + encodeURIComponent(key));
  } catch (e) {
    scheduleReconnect(s);
    return;
  }
  s.ws = ws;
  s.intentionalClose = false;
  s.connGen = (s.connGen || 0) + 1;
  var gen = s.connGen;
  ws.binaryType = "arraybuffer";

  ws.onopen = function () {
    try { ws.send(JSON.stringify(pairSetup(s.target, useHandle ? s.resumptionHandle : null))); }
    catch (e) { /* close handler will retry */ }
  };

  ws.onmessage = function (event) {
    decodeFrameData(event.data, function (text) {
      if (text === null) return;
      var obj = null;
      try { obj = JSON.parse(text); } catch (e) { return; }
      if (!obj || typeof obj !== "object") return;
      handleServerMessage(s, obj);
    });
  };

  ws.onerror = function () { /* detail arrives via onclose */ };

  ws.onclose = function (event) {
    if (gen !== s.connGen) return; // a newer connection owns this session now
    s.ready = false;
    if (s.ws === ws) s.ws = null;
    if (!running || s.intentionalClose) return;
    if (event && event.code === 1007) {
      // Invalid argument — most often a rejected key or a stale
      // resumption handle. Retry once fresh; if it repeats, it is fatal.
      if (useHandle) { connectSession(s, false); return; }
      fatalError = "Google rejected the connection — check the API key.";
      updateStatus();
      stopAll();
      return;
    }
    scheduleReconnect(s);
  };
}

function scheduleReconnect(s) {
  if (!running || s.reconnectTimer) return;
  var delay = BACKOFF_MS[Math.min(s.backoffIdx, BACKOFF_MS.length - 1)];
  s.backoffIdx++;
  s.reconnectTimer = setTimeout(function () {
    s.reconnectTimer = null;
    connectSession(s, !!s.resumptionHandle);
  }, delay);
}

function handleServerMessage(s, obj) {
  if (obj.error && typeof obj.error === "object") {
    var msg = String(obj.error.message || obj.error.status || "");
    if (/api key|API_KEY|permission/i.test(msg)) {
      fatalError = "Google rejected the API key.";
      updateStatus();
      stopAll();
    }
    return;
  }
  if (obj.setupComplete !== undefined) {
    s.ready = true;
    s.backoffIdx = 0;
    updateStatus();
  }
  if (obj.sessionResumptionUpdate &&
      typeof obj.sessionResumptionUpdate.newHandle === "string") {
    s.resumptionHandle = obj.sessionResumptionUpdate.newHandle;
  }
  if (obj.goAway !== undefined) {
    // Server is about to drop this session: roll onto a resumed one.
    var ws = s.ws;
    s.intentionalClose = true;
    s.ready = false;
    s.ws = null;
    if (ws) { try { ws.close(); } catch (e) {} }
    if (running) connectSession(s, true);
    return;
  }
  var sc = obj.serverContent;
  if (!sc || typeof sc !== "object") return;

  var inText = "", outText = "";
  if (sc.inputTranscription && typeof sc.inputTranscription.text === "string") {
    inText += sc.inputTranscription.text;
  }
  if (sc.interimInputTranscription && typeof sc.interimInputTranscription.text === "string") {
    inText += sc.interimInputTranscription.text;
  }
  if (sc.outputTranscription && typeof sc.outputTranscription.text === "string") {
    outText += sc.outputTranscription.text;
  }
  if (inText || outText) onTranscript(s, inText, outText);

  if (sc.modelTurn && Array.isArray(sc.modelTurn.parts)) {
    for (var i = 0; i < sc.modelTurn.parts.length; i++) {
      var part = sc.modelTurn.parts[i];
      if (part && part.inlineData && typeof part.inlineData.data === "string") {
        onAudioChunk(s, b64ToBytes(part.inlineData.data));
      }
    }
  }
  if (sc.turnComplete === true) onTurnComplete(s);
}

/* ---------------- Utterance flow ---------------- */

function beginUtteranceIfNeeded(s, t) {
  if (!s.uttStartAt) {
    s.uttStartAt = t;
    s.segStartAt = t;
    s.gatePassed = false;
    s.echo = false;
    s.wrongDirection = false;
    // preGateChunks may already hold this utterance's first audio,
    // which can arrive ahead of its first transcript event. Keep it.
    s.job = null;
  }
}

function onTranscript(s, inText, outText) {
  var t = now();
  beginUtteranceIfNeeded(s, t);
  if (inText) {
    s.inAcc += inText;
    s.lastInAt = t;
    if (!s.segStartAt) s.segStartAt = t;
  }
  if (outText) {
    s.outAcc += outText;
    s.lastOutAt = t;
  }
  s.lastTextAt = t;
  evaluateGate(s);
  tryCut(s, t);
  renderLive();
  updateStatus();
}

function onAudioChunk(s, bytes) {
  if (!bytes || !bytes.length) return;
  if (s.gatePassed && s.job) {
    addChunkToJob(s.job, bytes);
  } else if (!s.uttStartAt && s.tailJob && !s.tailJob.closed) {
    // No new utterance has begun in text: this is the previous
    // utterance's audio tail — it belongs to that job.
    addChunkToJob(s.tailJob, bytes);
  } else if (!s.wrongDirection && !s.echo) {
    // Gate undecided: buffer. If the gate later fails for this
    // utterance (echo / wrong direction), the buffer is discarded.
    s.preGateChunks.push(bytes);
  }
}

function onTurnComplete(s) {
  // The model's own turn boundary: if nothing is left uncut, the
  // utterance's text side is done — its audio tail seals on quiet.
  if (s.uttStartAt && !s.inAcc.trim() && !s.outAcc.trim()) {
    endUtteranceText(s);
  }
}

/* The gate: this session may sound only when the input transcript of
   the current utterance decisively votes for THIS session's source
   language — and the utterance is not the phone hearing itself. */
function evaluateGate(s) {
  if (s.gatePassed || !s.uttStartAt) return;
  if (s.echo) return;
  if (looksLikeEcho(s.inAcc)) {
    s.echo = true;
    s.preGateChunks = [];
    return;
  }
  var vote = scriptVote(s.inAcc);
  if (vote === s.source) {
    s.gatePassed = true;
    s.wrongDirection = false;
    var job = makeJob(s);
    s.job = job;
    s.openJobs.push(job);
    for (var i = 0; i < s.preGateChunks.length; i++) job.chunks.push(s.preGateChunks[i]);
    if (job.chunks.length) job.lastChunkAt = now();
    s.preGateChunks = [];
    playQueue.push(job);
    pumpPlayer();
  } else if (vote === "foreign" || (vote && vote !== s.source)) {
    // Decisively NOT this session's direction (yet): drop the buffered
    // audio once. Transcripts are append-only, but a speaker who opens
    // with a borrowed word can still flip the vote — chunks arriving
    // after a flip are buffered again from that point.
    if (!s.wrongDirection) {
      s.wrongDirection = true;
      s.preGateChunks = [];
    }
  }
}

/* ---------------- The cutter ----------------
   Runs on every transcript event and on the housekeeping tick.
   A pair is shown only if its source text votes for this session's
   source language (per-pair attribution) and is not an echo. */

function emitPair(s, srcText, dstText, startAt) {
  srcText = (srcText || "").trim();
  dstText = (dstText || "").trim();
  if (!srcText && !dstText) return;
  if (srcText && scriptVote(srcText) !== s.source) return;
  if (srcText && looksLikeEcho(srcText)) return;
  appendPairToStream(srcText, dstText, startAt);
  // Only the translation is ever played aloud, so only it can come
  // back through the mic as an echo.
  if (dstText) notePlayed(dstText);
}

function tryCut(s, t) {
  var guard = 0;
  while (guard++ < 8) {
    var iIn = firstSentenceEnd(s.inAcc);
    var iOut = firstSentenceEnd(s.outAcc);
    if (iIn >= 0 && iOut >= 0) {
      var src = s.inAcc.slice(0, iIn + 1);
      var dst = s.outAcc.slice(0, iOut + 1);
      s.inAcc = s.inAcc.slice(iIn + 1);
      s.outAcc = s.outAcc.slice(iOut + 1);
      emitPair(s, src, dst, s.segStartAt || t);
      s.segStartAt = s.inAcc.trim() || s.outAcc.trim() ? t : 0;
      continue;
    }
    break;
  }
  // Output-led: a complete translation sentence plus 0.3 s of input
  // stability cuts the pair with whatever source has accumulated.
  var oEnd = firstSentenceEnd(s.outAcc);
  if (oEnd >= 0 && s.inAcc.trim() && s.lastInAt && t - s.lastInAt >= 300) {
    var dst2 = s.outAcc.slice(0, oEnd + 1);
    var src2 = s.inAcc;
    s.outAcc = s.outAcc.slice(oEnd + 1);
    s.inAcc = "";
    emitPair(s, src2, dst2, s.segStartAt || t);
    s.segStartAt = s.outAcc.trim() ? t : 0;
    return;
  }
  // Hard cut: ~4 s of continuous speech with text on both sides —
  // cut at the last clause boundary, or take the whole segment.
  if (s.segStartAt && t - s.segStartAt >= 4000 && s.inAcc.trim() && s.outAcc.trim()) {
    var ci = clauseBoundary(s.inAcc);
    var co = clauseBoundary(s.outAcc);
    var src3 = ci > 0 ? s.inAcc.slice(0, ci + 1) : s.inAcc;
    var dst3 = co > 0 ? s.outAcc.slice(0, co + 1) : s.outAcc;
    s.inAcc = ci > 0 ? s.inAcc.slice(ci + 1) : "";
    s.outAcc = co > 0 ? s.outAcc.slice(co + 1) : "";
    emitPair(s, src3, dst3, s.segStartAt);
    s.segStartAt = (s.inAcc.trim() || s.outAcc.trim()) ? t : 0;
  }
}

/* Flush whatever text remains (silence backstop / turn end) and close
   the utterance's text side. Its audio job seals once chunks stop. */
function flushUtterance(s, t) {
  if (!s.uttStartAt) return;
  if (s.inAcc.trim() || s.outAcc.trim()) {
    emitPair(s, s.inAcc, s.outAcc, s.segStartAt || t);
  }
  s.inAcc = "";
  s.outAcc = "";
  endUtteranceText(s);
}

function endUtteranceText(s) {
  if (s.job) {
    s.job.textDone = true;
    s.tailJob = s.job;
  }
  if (!s.gatePassed) s.preGateChunks = [];
  s.uttStartAt = 0;
  s.segStartAt = 0;
  s.lastInAt = 0;
  s.lastOutAt = 0;
  s.gatePassed = false;
  s.echo = false;
  s.wrongDirection = false;
  s.job = null;
  renderLive();
}

/* ---------------- The stream view ----------------
   Doubao SI shape: ONE flowing stream; each pair is the original line
   with its translation directly beneath, same column, near-identical
   size. The live pair rewrites in place as transcripts stream. */

var streamEl = null;
var livePairEl = null, liveSrcEl = null, liveDstEl = null;
var lastFinalStartAt = 0;
var lastFinalPairEl = null;
var stickBottom = true;

function ensureLivePair() {
  if (livePairEl) return;
  livePairEl = document.createElement("div");
  livePairEl.className = "pair live";
  liveSrcEl = document.createElement("div");
  liveSrcEl.className = "src";
  liveDstEl = document.createElement("div");
  liveDstEl.className = "dst";
  livePairEl.appendChild(liveSrcEl);
  livePairEl.appendChild(liveDstEl);
  streamEl.appendChild(livePairEl);
}

function clearLivePair() {
  if (livePairEl && livePairEl.parentNode) livePairEl.parentNode.removeChild(livePairEl);
  livePairEl = null; liveSrcEl = null; liveDstEl = null;
}

/* The live pair belongs to the session whose current utterance votes
   for its own source language; before any vote lands, follow the most
   recent transcript activity and show the original line only. */
function renderLive() {
  if (!streamEl) return;
  var pick = null, fallback = null;
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    if (!s.uttStartAt || (!s.inAcc && !s.outAcc)) continue;
    if (!fallback || s.lastTextAt > fallback.lastTextAt) fallback = s;
    if (scriptVote(s.inAcc) === s.source) { pick = s; break; }
  }
  var show = pick || fallback;
  if (!show) { clearLivePair(); maybeScroll(); return; }
  ensureLivePair();
  liveSrcEl.textContent = show.inAcc;
  liveDstEl.textContent = pick ? show.outAcc : "";
  var hint = $("emptyHint");
  if (hint) hint.style.display = "none";
  maybeScroll();
}

function appendPairToStream(srcText, dstText, startAt) {
  var pair = document.createElement("div");
  pair.className = "pair";
  var src = document.createElement("div");
  src.className = "src";
  src.textContent = srcText;
  var dst = document.createElement("div");
  dst.className = "dst";
  dst.textContent = dstText;
  pair.appendChild(src);
  pair.appendChild(dst);
  // Fast alternation: a pair whose source began before the last shown
  // pair's is inserted in spoken order, not arrival order.
  if (lastFinalPairEl && startAt && lastFinalStartAt && startAt < lastFinalStartAt &&
      lastFinalStartAt - startAt < 2500 && lastFinalPairEl.parentNode === streamEl) {
    streamEl.insertBefore(pair, lastFinalPairEl);
  } else if (livePairEl) {
    streamEl.insertBefore(pair, livePairEl);
    lastFinalPairEl = pair;
    lastFinalStartAt = startAt || now();
  } else {
    streamEl.appendChild(pair);
    lastFinalPairEl = pair;
    lastFinalStartAt = startAt || now();
  }
  var hint = $("emptyHint");
  if (hint) hint.style.display = "none";
  maybeScroll();
}

function maybeScroll() {
  if (!streamEl) return;
  if (stickBottom) {
    streamEl.scrollTop = streamEl.scrollHeight;
    $("pill").classList.remove("show");
  } else {
    $("pill").classList.add("show");
  }
}

/* ---------------- Housekeeping ----------------
   Every 200 ms: silence backstops, deferred cuts (output-led needs
   0.3 s of stability, hard cuts need the 4 s mark), and audio-job
   sealing (an utterance's job seals after its text is done and its
   audio tail has been quiet for 0.9 s). */

var houseTimer = null;

function housekeeping() {
  var t = now();
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    if (s.uttStartAt) {
      tryCut(s, t);
      if (s.lastTextAt && t - s.lastTextAt >= 1200) {
        if (s.inAcc.trim() || s.outAcc.trim()) {
          flushUtterance(s, t);
        } else {
          // Everything already cut, but the utterance must still end
          // so its audio job can seal and free the voice channel.
          endUtteranceText(s);
        }
      }
    }
    for (var j = s.openJobs.length - 1; j >= 0; j--) {
      var job = s.openJobs[j];
      if (job.dead || job.closed) { s.openJobs.splice(j, 1); continue; }
      if (job.textDone && t - job.lastChunkAt >= 900) {
        sealJob(job);
        s.openJobs.splice(j, 1);
        if (s.tailJob === job) s.tailJob = null;
      }
    }
  }
  renderLive();
  updateStatus();
}

/* ---------------- Status line ---------------- */

var lastInterpretingAt = 0;
function updateStatus() {
  var el = $("status"), txt = $("statusText");
  el.classList.remove("live", "busy", "error");
  if (fatalError) {
    el.classList.add("error");
    txt.textContent = fatalError;
    return;
  }
  if (!running) {
    txt.textContent = apiKey() ? "Tap the button to start" : "Add your Gemini API key, then tap to start";
    return;
  }
  var readyCount = (sessEn.ready ? 1 : 0) + (sessZh.ready ? 1 : 0);
  if (readyCount < 2) {
    el.classList.add("busy");
    txt.textContent = "Connecting…";
    return;
  }
  el.classList.add("live");
  if (playingJob || now() - lastInterpretingAt < 1500) {
    txt.textContent = "Interpreting";
  } else {
    txt.textContent = "Listening";
  }
}

/* ---------------- Microphone ----------------
   getUserMedia -> ScriptProcessor -> linear-interpolation resample to
   16 kHz -> 100 ms PCM16 frames -> base64 -> BOTH sessions (the rig's
   exact frame shape). ScriptProcessor is deprecated but is the only
   capture path that works inline in a single file on iOS Safari. */

var micStream = null, micCtx = null, micNode = null, micSource = null;
var resampleAcc = [];        // Float32 samples already at 16 kHz
var resamplePos = 0;         // fractional read position in the input buffer stream
var pendingInput = [];       // Float32 input samples not yet consumed

function startMic() {
  var constraints = {
    audio: { echoCancellation: true, noiseSuppression: true },
    video: false
  };
  return navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
    micStream = stream;
    var AC = window.AudioContext || window.webkitAudioContext;
    micCtx = new AC();
    micSource = micCtx.createMediaStreamSource(stream);
    micNode = micCtx.createScriptProcessor(4096, 1, 1);
    resampleAcc = []; pendingInput = []; resamplePos = 0;
    micNode.onaudioprocess = function (ev) {
      var input = ev.inputBuffer.getChannelData(0);
      var ratio = micCtx.sampleRate / 16000;
      for (var i = 0; i < input.length; i++) pendingInput.push(input[i]);
      // Linear-interpolation resample, streaming.
      var out;
      while (true) {
        var idx = resamplePos;
        var i0 = Math.floor(idx), i1 = i0 + 1;
        if (i1 >= pendingInput.length) break;
        var frac = idx - i0;
        out = pendingInput[i0] * (1 - frac) + pendingInput[i1] * frac;
        resampleAcc.push(out);
        resamplePos += ratio;
      }
      var consumed = Math.floor(resamplePos);
      if (consumed > 0) {
        pendingInput.splice(0, consumed);
        resamplePos -= consumed;
      }
      // Emit whole 100 ms frames (1600 samples).
      while (resampleAcc.length >= 1600) {
        var frame = resampleAcc.splice(0, 1600);
        sendMicFrame(frame);
      }
    };
    micSource.connect(micNode);
    micNode.connect(micCtx.destination); // required for the processor to run
    return micCtx.resume();
  });
}

function sendMicFrame(samples) {
  var pcm = new Int16Array(1600);
  for (var i = 0; i < 1600; i++) {
    var v = Math.max(-1, Math.min(1, samples[i] || 0));
    pcm[i] = v < 0 ? v * 32768 : v * 32767;
  }
  var payload = JSON.stringify({
    realtimeInput: {
      audio: { data: bytesToB64(new Uint8Array(pcm.buffer)), mimeType: "audio/pcm;rate=16000" }
    }
  });
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    if (s.ws && s.ready && s.ws.readyState === WebSocket.OPEN) {
      try { s.ws.send(payload); } catch (e) { /* close handler retries */ }
    }
  }
}

function stopMic() {
  if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode.onaudioprocess = null; micNode = null; }
  if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
  if (micStream) {
    var tracks = micStream.getTracks();
    for (var i = 0; i < tracks.length; i++) { try { tracks[i].stop(); } catch (e) {} }
    micStream = null;
  }
  if (micCtx) { try { micCtx.close(); } catch (e) {} micCtx = null; }
  resampleAcc = []; pendingInput = [];
}

/* ---------------- Wake lock ---------------- */

var wakeLock = null;
function requestWakeLock() {
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  navigator.wakeLock.request("screen").then(function (lock) {
    wakeLock = lock;
  }).catch(function () { /* not granted — page still works */ });
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
document.addEventListener("visibilitychange", function () {
  if (running && document.visibilityState === "visible") requestWakeLock();
});

/* ---------------- Start / stop ---------------- */

function startAll() {
  if (!apiKey()) {
    var bar = $("keybar");
    bar.classList.remove("hidden");
    bar.classList.add("attention");
    $("keyInput").focus();
    return;
  }
  fatalError = null;
  running = true;
  // A new session is a blank conversation.
  streamEl.querySelectorAll(".pair").forEach(function (p) { p.remove(); });
  clearLivePair();
  lastFinalPairEl = null; lastFinalStartAt = 0;
  playedLog = [];
  var hint = $("emptyHint");
  if (hint) hint.style.display = "";
  ensurePlayCtx();
  if (playCtx.state === "suspended") playCtx.resume();
  $("callBtn").classList.add("on");
  requestWakeLock();
  connectSession(sessEn, false);
  connectSession(sessZh, false);
  startMic().catch(function () {
    fatalError = "Microphone blocked — allow mic access and retry.";
    updateStatus();
    stopAll();
  });
  if (!houseTimer) houseTimer = setInterval(housekeeping, 200);
  updateStatus();
}

function stopAll() {
  running = false;
  $("callBtn").classList.remove("on");
  releaseWakeLock();
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    s.intentionalClose = true;
    if (s.reconnectTimer) { clearTimeout(s.reconnectTimer); s.reconnectTimer = null; }
    if (s.ws) { try { s.ws.close(); } catch (e) {} s.ws = null; }
    s.ready = false;
    s.inAcc = ""; s.outAcc = "";
    s.uttStartAt = 0; s.segStartAt = 0;
    s.preGateChunks = [];
    s.gatePassed = false; s.echo = false; s.wrongDirection = false;
    s.job = null; s.tailJob = null; s.openJobs = [];
  }
  // The user's own stop ends the call outright: queued voices are
  // dropped and the sounding one is cut. (The never-interrupt law
  // governs speech barge-in, not the user's hang-up.)
  for (var q = 0; q < playQueue.length; q++) playQueue[q].dead = true;
  playQueue = [];
  if (playingJob) {
    playingJob.dead = true;
    playingJob = null;
  }
  if (playCtx) {
    var ctx = playCtx;
    playCtx = null;
    try { ctx.close(); } catch (e) {}
  }
  stopMic();
  clearLivePair();
  renderLive();
  updateStatus();
}

/* ---------------- Wiring ---------------- */

document.addEventListener("DOMContentLoaded", function () {
  streamEl = $("stream");

  streamEl.addEventListener("scroll", function () {
    var gap = streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight;
    stickBottom = gap < 60;
    $("pill").classList.toggle("show", !stickBottom);
  });
  $("pill").addEventListener("click", function () {
    stickBottom = true;
    streamEl.scrollTop = streamEl.scrollHeight;
    $("pill").classList.remove("show");
  });

  var saved = apiKey();
  if (saved) {
    $("keyInput").value = saved;
    $("keyEditRow").style.display = "none";
    $("keyNote").style.display = "none";
    $("keySavedRow").style.display = "flex";
  }
  $("keySave").addEventListener("click", function () {
    var v = $("keyInput").value.trim();
    if (!v) return;
    try { localStorage.setItem("translatorGeminiKey", v); } catch (e) {}
    $("keybar").classList.remove("attention");
    $("keyEditRow").style.display = "none";
    $("keyNote").style.display = "none";
    $("keySavedRow").style.display = "flex";
    updateStatus();
  });
  $("keyChange").addEventListener("click", function () {
    $("keyEditRow").style.display = "flex";
    $("keyNote").style.display = "block";
    $("keySavedRow").style.display = "none";
    $("keyInput").focus();
  });

  $("callBtn").addEventListener("click", function () {
    if (running) stopAll(); else startAll();
  });

  // "Interpreting" while a voice is sounding.
  setInterval(function () {
    if (playingJob) lastInterpretingAt = now();
  }, 300);

  updateStatus();
});
</script>
</body>
